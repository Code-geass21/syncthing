services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: jarvis-syncthing

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata

    volumes:
      - ./config:/config
      - ./sync:/sync

    ports:
      # Syncthing Web UI
      - "127.0.0.1:54313:8384"

      # Syncthing device-to-device synchronization
      - "22000:22000/tcp"
      - "22000:22000/udp"

      # Local network discovery
      - "21027:21027/udp"

    restart: unless-stopped
